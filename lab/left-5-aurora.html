<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>왼쪽 패널 시안 5 — 오로라 데이터 스트림</title>
<link rel="stylesheet" href="lab.css">
<style>
.legend{position:absolute;left:clamp(20px,4vw,48px);top:clamp(150px,22vh,200px);z-index:5;display:grid;gap:7px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:8px;font-size:12px;color:#bfb3a8;transition:color .4s}
.legend i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.legend span.on{color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="panel"><canvas class="stage"></canvas><span class="tag">시안 5 · 오로라 데이터 스트림</span>
  <div class="legend" data-legend></div>
</div>
<script src="lab.js"></script>
<script>
(function () {
  var TYPES = [['fine', '잔주름형', 8, [240, 168, 119]], ['sag', '변형·처짐형', 7, [232, 92, 62]], ['muscle', '근육형', 9, [214, 170, 92]],
               ['tired', '피로형', 9, [142, 124, 255]], ['early', '초기노화형', 7, [92, 200, 192]]];
  var lg = document.querySelector('[data-legend]');
  lg.innerHTML = TYPES.map(function (t) { return '<span data-k="' + t[0] + '"><i style="color:rgb(' + t[3] + ');background:rgb(' + t[3] + ')"></i>' + t[1] + '</span>'; }).join('');
  var cv = document.querySelector('.stage'), ctx = cv.getContext('2d'), W, H, DPR = Math.min(2, devicePixelRatio || 1);
  var weight = {}, wT = {}, energy = .2, energyT = .2, converge = 0, convT = 0, flash = 0, sparks = [];
  TYPES.forEach(function (t) { weight[t[0]] = .2; wT[t[0]] = .2; });

  function resize() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener('resize', resize); resize();

  function mixColor(shift) {
    var r = 0, g = 0, b = 0, s = 0;
    TYPES.forEach(function (t, i) { var w = weight[t[0]] * (1 + .4 * Math.sin(shift + i)); r += t[3][0] * w; g += t[3][1] * w; b += t[3][2] * w; s += w; });
    return [r / s | 0, g / s | 0, b / s | 0];
  }

  function frame(now) {
    var t = now / 1000;
    TYPES.forEach(function (ty) { weight[ty[0]] += (wT[ty[0]] - weight[ty[0]]) * .03; });
    energy += (energyT - energy) * .03; converge += (convT - converge) * .025; flash *= .95;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(22,18,16,.32)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var cy = 150 + (H - 230) / 2, cx = W / 2;
    var bands = 7;
    for (var b = 0; b < bands; b++) {
      var col = mixColor(t * .3 + b * .9), amp = (30 + energy * 90) * (1 - converge * .85), base = cy + (b - bands / 2) * (18 + energy * 14) * (1 - converge * .9);
      for (var pass = 0; pass < 3; pass++) {
        ctx.beginPath();
        for (var x = -20; x <= W + 20; x += 8) {
          var p = x / W, pull = converge * Math.exp(-Math.pow((p - .5) * 3, 2));
          var y = base + Math.sin(p * 5 + t * (.6 + b * .07) + b) * amp * .6 + Math.sin(p * 11 - t * .9 + b * 2) * amp * .25;
          y = y * (1 - pull) + cy * pull;
          x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(' + col + ',' + [.05, .09, .5][pass] * (.6 + energy * .5) + ')';
        ctx.lineWidth = [34, 14, 1.4][pass] * (1 + energy * .5);
        ctx.stroke();
      }
    }
    // 수렴 코어
    if (converge > .05) {
      var c = mixColor(t), rad = 40 + converge * 90 + Math.sin(t * 3) * 6 + flash * 60;
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad * 2.2);
      g.addColorStop(0, 'rgba(255,240,228,' + (.75 * converge) + ')'); g.addColorStop(.3, 'rgba(' + c + ',' + (.5 * converge) + ')'); g.addColorStop(1, 'rgba(' + c + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rad * 2.2, 0, 6.283); ctx.fill();
    }
    // 반짝이 — 답할 때 터져 나온다
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i]; s.x += s.vx; s.y += s.vy; s.vx *= .985; s.vy *= .985; s.life -= .012;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(' + s.c + ',' + s.life + ')'; ctx.beginPath(); ctx.arc(s.x, s.y, 1.6 * s.life + .4, 0, 6.283); ctx.fill();
    }
    if (Math.random() < .3) sparks.push({ x: Math.random() * W, y: cy + (Math.random() - .5) * 200, vx: (Math.random() - .5) * .4, vy: -Math.random() * .4, life: .8, c: mixColor(Math.random() * 6) });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function burst(rgb) { for (var i = 0; i < 70; i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 4; sparks.push({ x: W / 2, y: 150 + (H - 230) / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: rgb }); } }

  Lab.start({
    onStep: function (s) {
      TYPES.forEach(function (ty) { wT[ty[0]] = .2 + (s.counts[ty[0]] || 0) / ty[2] * 3; });
      energyT = .3 + s.progress * .9;
      if (s.type) { var ty = TYPES.filter(function (x) { return x[0] === s.type; })[0]; burst(ty[3]); }
      TYPES.forEach(function (ty) { var el = lg.querySelector('[data-k="' + ty[0] + '"]'); el.classList.toggle('on', ty[0] === s.type); });
    },
    onResult: function (r) {
      convT = 1; flash = 1; energyT = 1;
      TYPES.forEach(function (ty) { wT[ty[0]] = r.roles[ty[0]] ? 3 : .1; lg.querySelector('[data-k="' + ty[0] + '"]').classList.toggle('on', !!r.roles[ty[0]]); });
      burst([255, 220, 190]);
    },
    onReset: function () { convT = 0; energyT = .2; TYPES.forEach(function (ty) { wT[ty[0]] = .2; lg.querySelector('[data-k="' + ty[0] + '"]').classList.remove('on'); }); }
  });
})();
</script>
</body>
</html>
